name: Pages 배포

# Settings → Pages → Source 를 "GitHub Actions"로 둔 경우에 쓰는 배포 경로입니다.
# "Deploy from a branch(main / root)"로 둔 경우엔 GitHub가 자동 배포하므로 이 작업은 건너뛰어도 됩니다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["일일 자동 수집"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
