name: 일일 자동 수집

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스·논문·국가 신호 수집
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/collect.py
      - name: 변경분 커밋
        run: |
          git config user.name "pb-observatory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ feed.xml
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 자동 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
